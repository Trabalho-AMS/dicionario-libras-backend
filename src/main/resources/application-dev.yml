# Perfil de desenvolvimento: banco H2 em memória, sem instalar nada.
spring:
  datasource:
    url: jdbc:h2:mem:dicionario;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # O esquema é criado pelas migrações do Flyway (src/main/resources/db/migration)
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
