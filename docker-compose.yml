# Infraestrutura de desenvolvimento: banco PostgreSQL e bucket S3 (SeaweedFS).
# Subir: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dicionario_libras
      POSTGRES_USER: dicionario
      POSTGRES_PASSWORD: dicionario
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dicionario -d dicionario_libras"]
      interval: 5s
      retries: 10

  # Armazenamento de objetos compatível com S3 (vídeos e termos de consentimento).
  s3:
    image: chrislusf/seaweedfs:4.55
    # Volumes de 256 MB e reserva de 256 MB livres: os padrões (30 GB por volume e 1% do disco)
    # impedem a gravação em discos de desenvolvimento quase cheios
    command: server -dir=/data -master.volumeSizeLimitMB=256 -volume.max=40 -volume.minFreeSpace=256MiB -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
